<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心屿 · 纸艺风小镇 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F5F5F0;
      font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
    }

    /* 状态栏 */
    .status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 100;
      background: rgba(232, 224, 213, 0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(107, 107, 107, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 14px;
      color: #6B6B6B;
    }

    .status-bar .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-bar .right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      z-index: 100;
      background: rgba(232, 224, 213, 0.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(107, 107, 107, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.3s;
      font-size: 11px;
      color: #6B6B6B;
    }

    .nav-item.active {
      opacity: 1;
    }

    .nav-item .nav-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item.active .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #A8D5BA;
      margin-top: 2px;
    }

    /* 信息面板 */
    .info-panel {
      position: fixed;
      top: 60px;
      right: 16px;
      z-index: 90;
      background: rgba(250, 250, 248, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(107, 107, 107, 0.12);
      border-radius: 2px;
      padding: 16px 20px;
      max-width: 280px;
      font-size: 13px;
      line-height: 1.8;
      color: #4A4E69;
      box-shadow: 2px 3px 0 rgba(107, 107, 107, 0.08);
      transition: all 0.4s ease;
    }

    .info-panel h3 {
      font-size: 15px;
      margin-bottom: 8px;
      color: #3A506B;
      border-bottom: 1px solid rgba(107, 107, 107, 0.1);
      padding-bottom: 6px;
    }

    .info-panel .hint {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }

    /* 对话气泡 */
    .dialog-bubble {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 95;
      background: rgba(180, 199, 231, 0.95);
      border: 2px solid rgba(58, 80, 107, 0.2);
      padding: 14px 22px;
      max-width: 400px;
      font-size: 14px;
      line-height: 1.8;
      color: #3A506B;
      opacity: 0;
      transition: opacity 0.5s;
      box-shadow: 2px 3px 0 rgba(107, 107, 107, 0.1);
    }

    .dialog-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid rgba(180, 199, 231, 0.95);
    }

    .dialog-bubble.show {
      opacity: 1;
    }

    /* FAB 按钮 */
    .fab {
      position: fixed;
      z-index: 95;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 2px 3px 0 rgba(107, 107, 107, 0.15);
      font-size: 22px;
    }

    .fab:hover {
      transform: translateY(-2px);
      box-shadow: 2px 5px 0 rgba(107, 107, 107, 0.2);
    }

    .fab-write {
      bottom: 90px;
      right: 24px;
      background: #A8D5BA;
      color: white;
    }

    .fab-chat {
      bottom: 90px;
      left: 24px;
      background: #B4C7E7;
      color: white;
    }

    /* 标题 */
    .title-overlay {
      position: fixed;
      top: 56px;
      left: 20px;
      z-index: 90;
      font-size: 18px;
      color: #3A506B;
      letter-spacing: 2px;
      opacity: 0.7;
    }

    .title-overlay small {
      font-size: 11px;
      color: #999;
      display: block;
      margin-top: 2px;
      letter-spacing: 0;
    }
  </style>
</head>

<body>

  <div class="status-bar">
    <div class="left">
      <span>☀️</span>
      <span>午后 · 晴</span>
    </div>
    <div class="right">
      <span class="status-icon" title="通知">🔔</span>
      <span class="status-icon" title="设置">⚙️</span>
    </div>
  </div>

  <div class="title-overlay">
    心屿 · 折纸物语
    <small>Paper Origami Town — Visual Demo</small>
  </div>

  <div id="canvas-container"></div>

  <div class="info-panel" id="infoPanel">
    <h3>🏠 欢迎来到心屿</h3>
    <div>这是一座折纸小镇，所有建筑、角色和自然元素都由纸艺构成。</div>
    <div style="margin-top:6px;">
      <b>操作指南：</b><br>
      · 拖拽画面移动小镇<br>
      · 点击建筑查看详情<br>
      · 点击镜屋与镜我对话<br>
      · 观察纸鹤飞过天空
    </div>
    <div class="hint">按空格键切换白天/夜晚</div>
  </div>

  <div class="dialog-bubble" id="dialogBubble"></div>

  <div class="fab fab-write" title="快速写作" onclick="showDialog('纸羽毛笔已准备好……\\n在水面上书写你的思绪吧。')">✒️</div>
  <div class="fab fab-chat" title="快速对话" onclick="showDialog('镜我：我一直在等你。\\n今天想聊些什么呢？')">💬</div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="selectNav(this)">
      <div class="nav-icon">🏘️</div>
      <span>小镇</span>
      <div class="nav-dot"></div>
    </div>
    <div class="nav-item" onclick="selectNav(this)">
      <div class="nav-icon">📖</div>
      <span>日记</span>
      <div class="nav-dot" style="background:transparent"></div>
    </div>
    <div class="nav-item" onclick="selectNav(this)">
      <div class="nav-icon">💡</div>
      <span>知识</span>
      <div class="nav-dot" style="background:transparent"></div>
    </div>
    <div class="nav-item" onclick="selectNav(this)">
      <div class="nav-icon">🪞</div>
      <span>镜我</span>
      <div class="nav-dot" style="background:transparent"></div>
    </div>
    <div class="nav-item" onclick="selectNav(this)">
      <div class="nav-icon">👤</div>
      <span>我的</span>
      <div class="nav-dot" style="background:transparent"></div>
    </div>
  </div>

  <script>
    // ========== 心屿调色板 ==========
    const PALETTE = {
      mintGreen: '#A8D5BA',
      fogBlue: '#B4C7E7',
      warmApricot: '#F5E6D3',
      orangeYellow: '#E8A87C',
      grayPink: '#D4B5B0',
      mossGreen: '#C8D5B9',
      paperWhite: '#FAFAF8',
      inkGray: '#6B6B6B',
      inkBlack: '#1A1A1A',
      indigo: '#3A506B',
      driedTea: '#8B6F47',
      oatmeal: '#E8E0D5',
      skyDay: '#E8EEF5',
      skyNight: '#1A1E2E',
      stoneGray: '#C5C9D4',
    };

    // ========== 等距投影工具 ==========
    const TILE_W = 64, TILE_H = 32;
    function isoToScreen(gx, gy) {
      return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) };
    }

    // ========== Canvas 初始化 ==========
    const container = document.getElementById('canvas-container');
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let cameraX = canvas.width / 2 - 200;
    let cameraY = canvas.height / 2 - 200;
    let isDragging = false, dragStartX, dragStartY, camStartX, camStartY;
    let isNight = false;
    let time = 0;

    // ========== 建筑定义 ==========
    const buildings = [
      {
        name: '镜屋', nameEn: 'Mirror House', gx: 6, gy: 6, w: 3, h: 3,
        roofColor: PALETTE.fogBlue, wallColor: '#C8D8EC', desc: '圆顶折纸小屋，与镜我深度交流的地方。\n门前的水洼倒映着你的身影。',
        icon: '🪞', hasMirror: true
      },
      {
        name: '藏书阁', nameEn: 'Paper Library', gx: 0, gy: 3, w: 2.5, h: 3,
        roofColor: PALETTE.driedTea, wallColor: PALETTE.warmApricot, desc: '三层折纸塔楼，知识的殿堂。\n每本书都是一段智慧的结晶。',
        icon: '📚'
      },
      {
        name: '温室', nameEn: 'Paper Greenhouse', gx: 12, gy: 3, w: 2.5, h: 2,
        roofColor: PALETTE.mossGreen, wallColor: '#D8E8D0', desc: '硫酸纸玻璃花房，习惯在这里生长。\n每株植物都是一段坚持。',
        icon: '🌿'
      },
      {
        name: '记忆之泉', nameEn: 'Paper Spring', gx: 11, gy: 8, w: 2.5, h: 2.5,
        roofColor: PALETTE.fogBlue, wallColor: '#D0DFF0', desc: '折纸瀑布汇入池塘，日记化作纸船。\n每只纸船都承载一段记忆。',
        icon: '⛲', hasWater: true
      },
      {
        name: '剧场', nameEn: 'Paper Theater', gx: 1, gy: 9, w: 3, h: 2.5,
        roofColor: PALETTE.grayPink, wallColor: '#E0C8C4', desc: '折纸舞台，模拟对话与复盘。\n影子在这里与你共舞。',
        icon: '🎭'
      },
      {
        name: '中央广场', nameEn: 'Origami Square', gx: 5, gy: 3, w: 4, h: 3,
        roofColor: 'transparent', wallColor: PALETTE.oatmeal, desc: '小镇枢纽，折纸喷泉日夜不息。\n公告板上贴着今日的心愿。',
        icon: '⛲', isSquare: true
      },
    ];

    // ========== 纸鹤 ==========
    let paperBirds = [];
    function spawnBird() {
      paperBirds.push({
        x: -40, y: 60 + Math.random() * 120,
        speed: 0.8 + Math.random() * 0.6,
        wingPhase: Math.random() * Math.PI * 2,
        size: 10 + Math.random() * 8,
      });
    }

    // ========== 天气粒子（纸花瓣） ==========
    let petals = [];
    function spawnPetal() {
      petals.push({
        x: Math.random() * canvas.width, y: -10,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        speedY: 0.4 + Math.random() * 0.5,
        speedX: (Math.random() - 0.5) * 0.6,
        size: 3 + Math.random() * 4,
        color: [PALETTE.grayPink, PALETTE.mintGreen, PALETTE.warmApricot, '#F0D0D0'][Math.floor(Math.random() * 4)],
        alpha: 0.5 + Math.random() * 0.4,
      });
    }

    // ========== 环境树 ==========
    const trees = [];
    for (let i = 0; i < 18; i++) {
      let gx, gy, valid;
      do {
        gx = Math.random() * 16 - 1;
        gy = Math.random() * 14 - 1;
        valid = !buildings.some(b => gx >= b.gx - 0.5 && gx <= b.gx + b.w + 0.5 && gy >= b.gy - 0.5 && gy <= b.gy + b.h + 0.5);
      } while (!valid);
      trees.push({
        gx, gy, height: 30 + Math.random() * 25, crownSize: 18 + Math.random() * 14,
        color: [PALETTE.mossGreen, PALETTE.mintGreen, '#7DB88E', '#5A9E6F'][Math.floor(Math.random() * 4)],
        swayPhase: Math.random() * Math.PI * 2
      });
    }

    // ========== 折纸花 ==========
    const flowers = [];
    for (let i = 0; i < 30; i++) {
      let gx, gy, valid;
      do {
        gx = Math.random() * 16 - 1;
        gy = Math.random() * 14 - 1;
        valid = !buildings.some(b => gx >= b.gx - 0.3 && gx <= b.gx + b.w + 0.3 && gy >= b.gy - 0.3 && gy <= b.gy + b.h + 0.3);
      } while (!valid);
      flowers.push({
        gx, gy,
        color: [PALETTE.grayPink, PALETTE.orangeYellow, '#E8C8D8', PALETTE.mintGreen, '#C8B4D8'][Math.floor(Math.random() * 5)],
        size: 3 + Math.random() * 4, phase: Math.random() * Math.PI * 2
      });
    }

    // ========== NPC：镜我 ==========
    const mirrorSelf = { gx: 7, gy: 5, targetGx: 7, targetGy: 5, moveTimer: 0 };

    // ========== 绘制函数 ==========

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }
    function darken(hex, amount) {
      const { r, g, b } = hexToRgb(hex);
      const f = 1 - amount;
      return `rgb(${Math.floor(r * f)},${Math.floor(g * f)},${Math.floor(b * f)})`;
    }
    function withAlpha(hex, a) {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    }

    // 画等距菱形地砖
    function drawIsoTile(gx, gy, color, strokeColor) {
      const p = isoToScreen(gx, gy);
      const sx = p.x + cameraX, sy = p.y + cameraY;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + TILE_W / 2, sy + TILE_H / 2);
      ctx.lineTo(sx, sy + TILE_H);
      ctx.lineTo(sx - TILE_W / 2, sy + TILE_H / 2);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 0.5; ctx.stroke(); }
    }

    // 画等距建筑（带厚度）
    function drawBuilding(b) {
      const p = isoToScreen(b.gx, b.gy);
      const sx = p.x + cameraX, sy = p.y + cameraY;
      const bw = b.w * TILE_W / 2;
      const bh = b.h * TILE_H / 2;
      const wallH = b.isSquare ? 8 : 36 + Math.min(b.w, b.h) * 8;
      const thickness = 4; // 折纸厚度

      if (b.isSquare) {
        // 广场：只画地面
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + bw, sy + bh);
        ctx.lineTo(sx, sy + bh * 2);
        ctx.lineTo(sx - bw, sy + bh);
        ctx.closePath();
        const checker = (Math.floor(time / 60) % 2 === 0);
        ctx.fillStyle = checker ? PALETTE.oatmeal : '#DDD5C8';
        ctx.fill();
        ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.15);
        ctx.lineWidth = 0.5; ctx.stroke();
        // 喷泉
        const fx = sx, fy = sy + bh;
        ctx.beginPath();
        ctx.ellipse(fx, fy, 16, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = withAlpha(PALETTE.fogBlue, 0.5);
        ctx.fill();
        // 水柱
        const waterH = 12 + Math.sin(time * 0.05) * 3;
        ctx.beginPath();
        ctx.moveTo(fx - 3, fy);
        ctx.quadraticCurveTo(fx, fy - waterH, fx + 3, fy);
        ctx.fillStyle = withAlpha(PALETTE.fogBlue, 0.6);
        ctx.fill();
        return;
      }

      // 右侧面（厚度）
      ctx.beginPath();
      ctx.moveTo(sx + bw, sy + bh);
      ctx.lineTo(sx + bw + thickness, sy + bh + thickness / 2);
      ctx.lineTo(sx + bw + thickness, sy + bh + thickness / 2 + wallH);
      ctx.lineTo(sx + bw, sy + bh + wallH);
      ctx.closePath();
      ctx.fillStyle = darken(b.wallColor, 0.2);
      ctx.fill();

      // 左侧面（墙体）
      ctx.beginPath();
      ctx.moveTo(sx - bw, sy + bh);
      ctx.lineTo(sx, sy);
      ctx.lineTo(sx, sy + wallH);
      ctx.lineTo(sx - bw, sy + bh + wallH);
      ctx.closePath();
      ctx.fillStyle = b.wallColor;
      ctx.fill();
      ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.1);
      ctx.lineWidth = 0.5; ctx.stroke();

      // 右侧面（墙体）
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + bw, sy + bh);
      ctx.lineTo(sx + bw, sy + bh + wallH);
      ctx.lineTo(sx, sy + wallH);
      ctx.closePath();
      ctx.fillStyle = darken(b.wallColor, 0.08);
      ctx.fill();
      ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.1);
      ctx.lineWidth = 0.5; ctx.stroke();

      // 屋顶（菱形）
      const roofY = sy - (b.isSquare ? 0 : 6);
      ctx.beginPath();
      ctx.moveTo(sx, roofY - 8);
      ctx.lineTo(sx + bw + 4, roofY + bh - 2);
      ctx.lineTo(sx, roofY + bh * 2 + 2);
      ctx.lineTo(sx - bw - 4, roofY + bh - 2);
      ctx.closePath();
      ctx.fillStyle = b.roofColor;
      ctx.fill();
      ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.12);
      ctx.lineWidth = 0.5; ctx.stroke();

      // 折痕线（屋顶）
      ctx.beginPath();
      ctx.moveTo(sx, roofY - 8);
      ctx.lineTo(sx, roofY + bh * 2 + 2);
      ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.08);
      ctx.lineWidth = 0.5; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx - bw - 4, roofY + bh - 2);
      ctx.lineTo(sx + bw + 4, roofY + bh - 2);
      ctx.stroke();

      // 窗户
      if (!b.isSquare && wallH > 20) {
        const winCount = Math.floor(b.w);
        for (let i = 0; i < winCount; i++) {
          const wx = sx + (i + 0.5) * (bw / winCount) - bw * 0.1;
          const wy = sy + wallH * 0.3 + (i % 2) * 8;
          const winW = 6, winH = 8;
          ctx.fillStyle = isNight ? withAlpha('#FFE4A0', 0.7 + Math.sin(time * 0.02 + i) * 0.2) : withAlpha(PALETTE.fogBlue, 0.3);
          ctx.fillRect(wx, wy, winW, winH);
          ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.15);
          ctx.lineWidth = 0.5;
          ctx.strokeRect(wx, wy, winW, winH);
        }
      }

      // 门
      if (!b.isSquare) {
        const dx = sx - 4, dy = sy + wallH - 14;
        ctx.fillStyle = darken(b.wallColor, 0.15);
        ctx.fillRect(dx, dy, 8, 14);
        ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.2);
        ctx.lineWidth = 0.5;
        ctx.strokeRect(dx, dy, 8, 14);
      }

      // 水洼（镜屋特有）
      if (b.hasMirror) {
        const mx = sx - bw * 0.3, my = sy + bh + wallH + 6;
        ctx.beginPath();
        ctx.ellipse(mx, my, 18, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = withAlpha(PALETTE.fogBlue, 0.25 + Math.sin(time * 0.03) * 0.1);
        ctx.fill();
        // 倒影涟漪
        ctx.beginPath();
        ctx.ellipse(mx, my, 10 + Math.sin(time * 0.04) * 4, 4 + Math.sin(time * 0.04) * 2, 0, 0, Math.PI * 2);
        ctx.strokeStyle = withAlpha(PALETTE.fogBlue, 0.15);
        ctx.lineWidth = 0.5; ctx.stroke();
      }

      // 建筑名称标签
      ctx.fillStyle = withAlpha(PALETTE.indigo, 0.7);
      ctx.font = '11px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.icon + ' ' + b.name, sx, sy + wallH + bh + 16);
    }

    // 画树
    function drawTree(t) {
      const p = isoToScreen(t.gx, t.gy);
      const sx = p.x + cameraX, sy = p.y + cameraY;
      const sway = Math.sin(time * 0.015 + t.swayPhase) * 2;

      // 树干
      ctx.fillStyle = PALETTE.driedTea;
      ctx.fillRect(sx - 2, sy - t.height, 4, t.height);

      // 树冠（多层折纸三角形）
      for (let layer = 0; layer < 3; layer++) {
        const ly = sy - t.height + layer * (t.crownSize * 0.35) - 5;
        const ls = t.crownSize - layer * 3;
        ctx.beginPath();
        ctx.moveTo(sx + sway, ly - ls * 0.6);
        ctx.lineTo(sx + ls * 0.6 + sway * 0.5, ly + ls * 0.3);
        ctx.lineTo(sx - ls * 0.6 + sway * 0.5, ly + ls * 0.3);
        ctx.closePath();
        ctx.fillStyle = darken(t.color, layer * 0.08);
        ctx.fill();
        ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.06);
        ctx.lineWidth = 0.5; ctx.stroke();
      }

      // 树影
      ctx.beginPath();
      ctx.ellipse(sx + 6, sy + 3, t.crownSize * 0.4, t.crownSize * 0.15, 0.3, 0, Math.PI * 2);
      ctx.fillStyle = withAlpha(PALETTE.inkGray, 0.06);
      ctx.fill();
    }

    // 画花
    function drawFlower(f) {
      const p = isoToScreen(f.gx, f.gy);
      const sx = p.x + cameraX, sy = p.y + cameraY;
      const pulse = 1 + Math.sin(time * 0.02 + f.phase) * 0.15;
      const s = f.size * pulse;

      // 花瓣（4片折纸三角）
      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2 + time * 0.005;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(angle) * s, sy + Math.sin(angle) * s * 0.5);
        ctx.lineTo(sx + Math.cos(angle + 0.5) * s * 0.6, sy + Math.sin(angle + 0.5) * s * 0.3);
        ctx.closePath();
        ctx.fillStyle = withAlpha(f.color, 0.7);
        ctx.fill();
      }
      // 花心
      ctx.beginPath();
      ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = PALETTE.orangeYellow;
      ctx.fill();
    }

    // 画镜我 NPC
    function drawMirrorSelf() {
      const p = isoToScreen(mirrorSelf.gx, mirrorSelf.gy);
      const sx = p.x + cameraX, sy = p.y + cameraY;
      const breathe = Math.sin(time * 0.03) * 1.5;

      // 影子
      ctx.beginPath();
      ctx.ellipse(sx, sy + 2, 10, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = withAlpha(PALETTE.inkGray, 0.1);
      ctx.fill();

      // 身体（折纸人 - 梯形）
      ctx.beginPath();
      ctx.moveTo(sx - 8, sy);
      ctx.lineTo(sx - 5, sy - 28 + breathe);
      ctx.lineTo(sx + 5, sy - 28 + breathe);
      ctx.lineTo(sx + 8, sy);
      ctx.closePath();
      ctx.fillStyle = withAlpha(PALETTE.fogBlue, 0.7);
      ctx.fill();
      ctx.strokeStyle = withAlpha(PALETTE.indigo, 0.3);
      ctx.lineWidth = 0.8; ctx.stroke();

      // 头（圆形）
      ctx.beginPath();
      ctx.arc(sx, sy - 32 + breathe, 7, 0, Math.PI * 2);
      ctx.fillStyle = withAlpha(PALETTE.paperWhite, 0.9);
      ctx.fill();
      ctx.strokeStyle = withAlpha(PALETTE.indigo, 0.2);
      ctx.lineWidth = 0.8; ctx.stroke();

      // 光晕
      ctx.beginPath();
      ctx.arc(sx, sy - 20 + breathe, 20, 0, Math.PI * 2);
      const glow = ctx.createRadialGradient(sx, sy - 20 + breathe, 2, sx, sy - 20 + breathe, 20);
      glow.addColorStop(0, withAlpha(PALETTE.fogBlue, 0.15));
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fill();

      // 名称
      ctx.fillStyle = withAlpha(PALETTE.indigo, 0.6);
      ctx.font = '10px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.fillText('镜我', sx, sy + 14);
    }

    // 画纸鹤
    function drawBird(bird) {
      const sx = bird.x + cameraX * 0.3; // 视差效果
      const sy = bird.y;
      const wingAngle = Math.sin(time * 0.08 + bird.wingPhase) * 0.5;
      const s = bird.size;

      ctx.save();
      ctx.translate(sx, sy);

      // 身体
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(s * 0.8, -s * 0.2);
      ctx.lineTo(s * 0.4, 0);
      ctx.lineTo(s * 0.8, s * 0.2);
      ctx.closePath();
      ctx.fillStyle = isNight ? withAlpha(PALETTE.paperWhite, 0.6) : withAlpha(PALETTE.paperWhite, 0.85);
      ctx.fill();
      ctx.strokeStyle = withAlpha(PALETTE.inkGray, 0.2);
      ctx.lineWidth = 0.5; ctx.stroke();

      // 左翅
      ctx.save();
      ctx.rotate(-wingAngle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-s * 0.5, -s * 0.6);
      ctx.lineTo(-s * 0.1, -s * 0.1);
      ctx.closePath();
      ctx.fillStyle = withAlpha(PALETTE.grayPink, 0.6);
      ctx.fill();
      ctx.restore();

      // 右翅
      ctx.save();
      ctx.rotate(wingAngle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-s * 0.5, s * 0.6);
      ctx.lineTo(-s * 0.1, s * 0.1);
      ctx.closePath();
      ctx.fillStyle = withAlpha(PALETTE.grayPink, 0.6);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // 画纸花瓣
    function drawPetal(petal) {
      ctx.save();
      ctx.translate(petal.x, petal.y);
      ctx.rotate(petal.rot);
      ctx.globalAlpha = petal.alpha;
      ctx.beginPath();
      ctx.moveTo(0, -petal.size);
      ctx.lineTo(petal.size * 0.6, 0);
      ctx.lineTo(0, petal.size * 0.4);
      ctx.lineTo(-petal.size * 0.6, 0);
      ctx.closePath();
      ctx.fillStyle = petal.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // ========== 地面绘制 ==========
    function drawGround() {
      for (let gy = -2; gy < 16; gy++) {
        for (let gx = -2; gx < 18; gx++) {
          const isPath = (gx >= 4 && gx <= 9 && gy >= 2 && gy <= 12) ||
            (gx >= 0 && gx <= 14 && gy >= 4 && gy <= 6);
          const baseColor = isPath
            ? ((gx + gy) % 2 === 0 ? '#E2DAD0' : '#D8D0C5')
            : ((gx + gy) % 2 === 0 ? '#D5DEC8' : '#CDD6C0');
          const strokeC = withAlpha(PALETTE.inkGray, isPath ? 0.06 : 0.04);
          drawIsoTile(gx, gy, baseColor, strokeC);
        }
      }
    }

    // ========== 路径绘制 ==========
    function drawPaths() {
      const pathPairs = [
        { from: { gx: 7, gy: 5 }, to: { gx: 7, gy: 4 }, color: PALETTE.oatmeal },
        { from: { gx: 3, gy: 5 }, to: { gx: 5, gy: 5 }, color: PALETTE.stoneGray },
        { from: { gx: 9, gy: 5 }, to: { gx: 11, gy: 5 }, color: PALETTE.stoneGray },
      ];
      pathPairs.forEach(pp => {
        const p1 = isoToScreen(pp.from.gx, pp.from.gy);
        const p2 = isoToScreen(pp.to.gx, pp.to.gy);
        ctx.beginPath();
        ctx.moveTo(p1.x + cameraX, p1.y + cameraY);
        ctx.lineTo(p2.x + cameraX, p2.y + cameraY);
        ctx.strokeStyle = withAlpha(pp.color, 0.4);
        ctx.lineWidth = 8; ctx.stroke();
      });
    }

    // ========== 天空 ==========
    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (isNight) {
        grad.addColorStop(0, '#0D1321');
        grad.addColorStop(0.5, '#1A1E2E');
        grad.addColorStop(1, '#2A2E3E');
      } else {
        grad.addColorStop(0, '#D8E4F0');
        grad.addColorStop(0.5, '#E8EEF5');
        grad.addColorStop(1, '#F5F0E8');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 星星（夜晚）
      if (isNight) {
        for (let i = 0; i < 40; i++) {
          const sx = (i * 137.5 + 50) % canvas.width;
          const sy = (i * 73.1 + 20) % (canvas.height * 0.4);
          const twinkle = 0.3 + Math.sin(time * 0.02 + i) * 0.3;
          ctx.beginPath();
          ctx.arc(sx, sy, 1 + (i % 3) * 0.5, 0, Math.PI * 2);
          ctx.fillStyle = withAlpha('#FFE4A0', twinkle);
          ctx.fill();
        }
      }

      // 远景山影（折纸剪影）
      ctx.beginPath();
      ctx.moveTo(0, canvas.height * 0.35);
      for (let x = 0; x <= canvas.width; x += 60) {
        const h = Math.sin(x * 0.005 + 1) * 30 + Math.sin(x * 0.012) * 15;
        ctx.lineTo(x, canvas.height * 0.32 - h);
      }
      ctx.lineTo(canvas.width, canvas.height * 0.4);
      ctx.lineTo(0, canvas.height * 0.4);
      ctx.closePath();
      ctx.fillStyle = isNight ? withAlpha('#2A3040', 0.5) : withAlpha(PALETTE.stoneGray, 0.2);
      ctx.fill();
    }

    // ========== 纸张纹理 overlay ==========
    function drawPaperOverlay() {
      ctx.globalAlpha = 0.03;
      for (let i = 0; i < 200; i++) {
        const x = (i * 97.3) % canvas.width;
        const y = (i * 61.7) % canvas.height;
        ctx.fillStyle = i % 2 === 0 ? '#000' : '#fff';
        ctx.fillRect(x, y, 2 + (i % 3), 1);
      }
      ctx.globalAlpha = 1;
    }

    // ========== 主渲染循环 ==========
    function render() {
      time++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawSky();
      drawGround();
      drawPaths();

      // 收集所有可绘制对象并按深度排序
      const drawables = [];

      trees.forEach(t => drawables.push({ depth: t.gx + t.gy, draw: () => drawTree(t) }));
      flowers.forEach(f => drawables.push({ depth: f.gx + f.gy, draw: () => drawFlower(f) }));
      buildings.forEach(b => drawables.push({ depth: b.gx + b.gy + b.w, draw: () => drawBuilding(b) }));
      drawables.push({ depth: mirrorSelf.gx + mirrorSelf.gy, draw: drawMirrorSelf });

      drawables.sort((a, b) => a.depth - b.depth);
      drawables.forEach(d => d.draw());

      // 纸鹤
      paperBirds.forEach(b => {
        b.x += b.speed;
        b.y += Math.sin(time * 0.01 + b.wingPhase) * 0.3;
        drawBird(b);
      });
      paperBirds = paperBirds.filter(b => b.x < canvas.width + 50);
      if (Math.random() < 0.005) spawnBird();

      // 花瓣
      petals.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(time * 0.01 + p.rot) * 0.3;
        p.rot += p.rotSpeed;
        drawPetal(p);
      });
      petals = petals.filter(p => p.y < canvas.height + 20);
      if (Math.random() < 0.03) spawnPetal();

      // 镜我移动
      mirrorSelf.moveTimer++;
      if (mirrorSelf.moveTimer > 200) {
        mirrorSelf.moveTimer = 0;
        mirrorSelf.targetGx = 6 + Math.random() * 3;
        mirrorSelf.targetGy = 4 + Math.random() * 3;
      }
      mirrorSelf.gx += (mirrorSelf.targetGx - mirrorSelf.gx) * 0.005;
      mirrorSelf.gy += (mirrorSelf.targetGy - mirrorSelf.gy) * 0.005;

      drawPaperOverlay();
      requestAnimationFrame(render);
    }

    // ========== 交互 ==========
    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      dragStartX = e.clientX; dragStartY = e.clientY;
      camStartX = cameraX; camStartY = cameraY;
    });
    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return;
      cameraX = camStartX + (e.clientX - dragStartX);
      cameraY = camStartY + (e.clientY - dragStartY);
    });
    canvas.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });

    // 触摸支持
    canvas.addEventListener('touchstart', e => {
      isDragging = true;
      dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
      camStartX = cameraX; camStartY = cameraY;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (!isDragging) return;
      cameraX = camStartX + (e.touches[0].clientX - dragStartX);
      cameraY = camStartY + (e.touches[0].clientY - dragStartY);
    }, { passive: true });
    canvas.addEventListener('touchend', () => { isDragging = false; });

    // 点击建筑
    canvas.addEventListener('click', e => {
      const mx = e.clientX - cameraX, my = e.clientY - cameraY;
      for (const b of buildings) {
        const p = isoToScreen(b.gx + b.w / 2, b.gy + b.h / 2);
        const dx = mx - p.x, dy = my - p.y;
        if (Math.abs(dx) < b.w * TILE_W / 3 && Math.abs(dy) < b.h * TILE_H / 2 + 20) {
          showDialog(`${b.icon} ${b.name}（${b.nameEn}）\n${b.desc}`);
          document.getElementById('infoPanel').innerHTML = `<h3>${b.icon} ${b.name}</h3><div>${b.desc.replace(/\n/g, '<br>')}</div><div class="hint">${b.nameEn}</div>`;
          return;
        }
      }
      // 点击镜我
      const mp = isoToScreen(mirrorSelf.gx, mirrorSelf.gy);
      if (Math.abs(mx - mp.x) < 20 && Math.abs(my - mp.y) < 30) {
        const phrases = [
          '镜我：你今天看起来有些疲惫呢。\n坐下来聊聊吧。',
          '镜我：我记得你上次说过的那件事……\n它还在你心里吗？',
          '镜我：有时候，安静地待一会儿\n比什么都重要。',
          '镜我：你看，纸鹤又飞过来了。\n每一只都带着一个小心愿。',
        ];
        showDialog(phrases[Math.floor(Math.random() * phrases.length)]);
      }
    });

    // 日夜切换
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        isNight = !isNight;
        showDialog(isNight ? '🌙 夜幕降临，灯笼渐次亮起……' : '☀️ 晨光透过纸雾，小镇苏醒了。');
      }
    });

    // ========== UI 辅助 ==========
    function showDialog(text) {
      const bubble = document.getElementById('dialogBubble');
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(bubble._timer);
      bubble._timer = setTimeout(() => bubble.classList.remove('show'), 4000);
    }

    function selectNav(el) {
      document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.remove('active');
        n.querySelector('.nav-dot').style.background = 'transparent';
      });
      el.classList.add('active');
      el.querySelector('.nav-dot').style.background = '#A8D5BA';
    }

    // 窗口大小调整
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // 初始生成一些纸鹤和花瓣
    for (let i = 0; i < 3; i++) { paperBirds.push({ x: Math.random() * canvas.width, y: 60 + Math.random() * 100, speed: 0.8 + Math.random() * 0.5, wingPhase: Math.random() * Math.PI * 2, size: 10 + Math.random() * 6 }); }
    for (let i = 0; i < 10; i++) spawnPetal();

    // 启动
    render();
  </script>
</body>

</html>
